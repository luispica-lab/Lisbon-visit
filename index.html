<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J&amp;TJ Lisbon</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#E6A8B8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="J&amp;TJ Lisbon">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400;0,600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--ink:#15151C;--ink45:#85858F;--ink70:#4C4C57;--paper:#FBF8F9;--panel:#fff;
        --line:#E7E1E4;--pink:#E6A8B8;--pink-d:#C4788E;--err:#A63D40}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;
    display:grid;place-items:center;padding:24px;
    padding-top:calc(24px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  .box{width:100%;max-width:330px;text-align:center}
  img.logo{width:78px;height:78px;border-radius:50%;margin:0 auto 22px;display:block}
  h1{font-family:"Familjen Grotesk",sans-serif;font-weight:600;letter-spacing:-.025em;
    font-size:29px;line-height:1.05;margin:0}
  h1 em{font-style:italic;font-weight:400;color:var(--pink-d)}
  .sub{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--ink45);margin-top:11px}
  form{margin-top:26px}
  input[type=password]{width:100%;height:52px;border:1px solid var(--line);border-radius:11px;
    background:var(--panel);padding:0 16px;font-size:16px;font-family:inherit;color:var(--ink);
    text-align:center;letter-spacing:.02em;outline:none;transition:border-color .15s}
  input[type=password]:focus{border-color:var(--pink-d)}
  input[type=password]::placeholder{color:var(--ink45);letter-spacing:.06em}
  button{width:100%;height:52px;margin-top:10px;border-radius:11px;background:var(--ink);
    color:var(--paper);font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.09em;
    text-transform:uppercase;cursor:pointer;transition:opacity .15s;border:0}
  button:disabled{opacity:.5;cursor:default}
  .remember{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:16px;
    font-size:13.5px;color:var(--ink70);cursor:pointer}
  .remember input{appearance:none;-webkit-appearance:none;width:17px;height:17px;flex:none;
    border:1.5px solid var(--ink45);border-radius:4px;background:var(--panel);position:relative;cursor:pointer}
  .remember input:checked{background:var(--ink);border-color:var(--ink)}
  .remember input:checked::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;
    border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(42deg)}
  .msg{min-height:20px;margin-top:14px;font-family:"JetBrains Mono",monospace;font-size:10.5px;
    letter-spacing:.05em;color:var(--ink45)}
  .msg.err{color:var(--err)}
  .foot{margin-top:30px;font-family:"JetBrains Mono",monospace;font-size:9.5px;color:var(--ink45);
    line-height:1.7;letter-spacing:.03em}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="box">
  <img class="logo" src="./icon-192.png" alt="Joe &amp; The Juice">
  <h1>Lisbon,<br>street by <em>street</em></h1>
  <div class="sub">Market visit · 24 August 2026</div>

  <form id="f" autocomplete="off">
    <input type="password" id="pw" placeholder="Access code" autocomplete="current-password"
           autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button type="submit" id="go">Open</button>
    <label class="remember"><input type="checkbox" id="rm" checked><span>Keep me signed in on this phone</span></label>
  </form>

  <div class="msg" id="msg"></div>
  <div class="foot">Private document. Contents are encrypted<br>and cannot be read without the code.</div>
</div>

<script>
(function(){
'use strict';
var KEY = 'jtj-lisbon-code';
var msg = document.getElementById('msg');
var pw  = document.getElementById('pw');
var go  = document.getElementById('go');
var rm  = document.getElementById('rm');

function say(t, err){ msg.textContent = t || ''; msg.className = 'msg' + (err ? ' err' : ''); }

function b64(s){
  var bin = atob(s), a = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}

var cached = null;
function payload(){
  if (cached) return Promise.resolve(cached);
  return fetch('./app.dat', {cache:'force-cache'})
    .then(function(r){ if(!r.ok) throw new Error('fetch'); return r.text(); })
    .then(function(t){ cached = b64(t.trim()); return cached; });
}

function open_(code, quiet){
  if (!window.crypto || !crypto.subtle) {
    say('This browser cannot decrypt. Use Safari or Chrome.', true);
    return Promise.resolve(false);
  }
  go.disabled = true;
  if (!quiet) say('Opening…');
  return payload().then(function(buf){
    var salt = buf.slice(0,16), iv = buf.slice(16,28), ct = buf.slice(28);
    var enc = new TextEncoder().encode(code);
    return crypto.subtle.importKey('raw', enc, 'PBKDF2', false, ['deriveKey'])
      .then(function(base){
        return crypto.subtle.deriveKey(
          {name:'PBKDF2', salt:salt, iterations:250000, hash:'SHA-256'},
          base, {name:'AES-GCM', length:256}, false, ['decrypt']);
      })
      .then(function(k){ return crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, k, ct); })
      .then(function(plain){
        var html = new TextDecoder().decode(plain);
        try { if (rm.checked) localStorage.setItem(KEY, code); } catch(e){}
        document.open(); document.write(html); document.close();
        return true;
      });
  }).catch(function(e){
    go.disabled = false;
    try { localStorage.removeItem(KEY); } catch(e2){}
    if (String(e && e.message) === 'fetch') say('Could not load the document. Check your connection.', true);
    else say('Wrong code. Try again.', true);
    pw.value = '';
    if (!quiet) pw.focus();
    return false;
  });
}

document.getElementById('f').addEventListener('submit', function(e){
  e.preventDefault();
  var v = pw.value.trim();
  if (v) open_(v, false);
});

var saved = null;
try { saved = localStorage.getItem(KEY); } catch(e){}
if (saved) { say('Opening…'); open_(saved, true); } else { pw.focus(); }
})();
</script>
</body>
</html>
